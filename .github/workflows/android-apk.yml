name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-professional

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable APK
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk masaedi-alyoumi-v3.0.0.apk
          sha256sum masaedi-alyoumi-v3.0.0.apk > masaedi-alyoumi-v3.0.0.sha256

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: masaedi-alyoumi-v3.0.0
          path: |
            masaedi-alyoumi-v3.0.0.apk
            masaedi-alyoumi-v3.0.0.sha256
          if-no-files-found: error
          retention-days: 30
